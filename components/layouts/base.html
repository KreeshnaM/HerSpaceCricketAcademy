<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ page_title }}</title>
<meta name="description" content="{{ description }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ academy_name }}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:image" content="assets/images/hero/hero-batter-ready.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#fff7ef">

<link rel="icon" href="assets/images/HerSpace_Logo.jpeg" type="image/jpeg">
<link rel="apple-touch-icon" href="assets/images/HerSpace_Logo.jpeg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..600&display=swap">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/sections.css">

<script>
  // Drop the no-js class immediately so styles never flash the fallback.
  document.documentElement.classList.remove('no-js');
  // Append ?placeholders to any URL to highlight every unfinished detail.
  if (location.search.indexOf('placeholders') > -1) {
    document.addEventListener('DOMContentLoaded', function () {
      document.body.classList.add('show-placeholders');
    });
  }
</script>
</head>

<body data-page="{{ nav }}" class="{{ body_class }}">

<a class="skip-link" href="#main">Skip to content</a>
<div class="grain" aria-hidden="true"></div>

<!-- @include components/nav.html -->

<main id="main">
{{ content }}
</main>

<!-- @include components/footer.html -->

<script src="assets/js/nav.js" defer></script>
<script src="assets/js/reveal.js" defer></script>
<script src="assets/js/counters.js" defer></script>
<script src="assets/js/forms.js" defer></script>
</body>
</html>
