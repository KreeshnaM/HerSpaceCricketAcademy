<header class="site-header">
  <div class="wrap">
    <nav class="nav" aria-label="Main">

      <a class="brand" href="index.html">
        <img class="brand__logo" src="assets/images/HerSpace_Logo.jpeg"
             alt="HerSpace National Cricket Academy logo" width="64" height="64">
        <span class="brand__text">
          <span>HerSpace</span>
          <span class="brand__sub">Girls Cricket Academy</span>
        </span>
      </a>

      <ul class="nav__list">
        <li><a class="nav__link" data-nav="home" href="index.html">Home</a></li>
        <li><a class="nav__link" data-nav="about" href="about.html">About</a></li>
        <li><a class="nav__link" data-nav="contact" href="contact.html">Contact</a></li>
      </ul>

      <a class="btn btn--primary nav__cta" href="contact.html#ask">Contact Us</a>

      <button class="nav__toggle" type="button"
              aria-expanded="false" aria-controls="nav-panel">
        <span class="nav__bars" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
        <span class="nav__toggle-text">Menu</span>
      </button>

    </nav>
  </div>
</header>

<!--
  The mobile panel lives OUTSIDE <header> on purpose. The header uses
  backdrop-filter, and that makes it the containing block for any
  position:fixed descendant - which would stop this panel from covering the
  screen. Keeping it a sibling means `inset` resolves against the viewport.
-->
<nav class="nav__panel" id="nav-panel" aria-label="Menu">
  <a class="nav__panel-link" data-nav="home" href="index.html">Home</a>
  <a class="nav__panel-link" data-nav="about" href="about.html">About</a>
  <a class="nav__panel-link" data-nav="contact" href="contact.html">Contact</a>

  <div class="nav__panel-foot">
    <a class="btn btn--primary btn--ball" href="contact.html#ask">Contact Us</a>
    <p class="form__note">
      Questions? Email <a href="mailto:{{ email }}"><span class="tbc">{{ email }}</span></a>
    </p>
  </div>
</nav>
